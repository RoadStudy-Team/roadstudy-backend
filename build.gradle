plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.roadstudy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web MVC, request validation, and OpenAI HTTP client (RestClient)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Persistence (JPA and PostgreSQL)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // API documentation (OpenAPI and Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.10.0'

    // PDF text extraction
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'

    // Google Cloud Text-to-Speech
    implementation 'com.google.cloud:google-cloud-texttospeech:2.102.0'

    // Lombok annotation processing
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Tests (Spring Boot, JUnit Platform, and H2)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
