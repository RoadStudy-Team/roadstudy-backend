spring:
  config:
    import: 'optional:file:.env[.properties]'
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: roadstudy
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/roadstudy
    username: roadstudy
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

