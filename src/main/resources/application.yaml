spring:
  application:
    name: roadstudy
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/roadstudy
    username: roadstudy
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

---
spring:
  config:
    import: 'optional:file:./.env[.properties]'
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: update
